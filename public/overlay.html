<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Metrobus — OBS overlay</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="overlay overlay-composite" data-mode="unified">
  <main id="canvas" aria-live="off">
    <section id="event-layer" class="obs-layer" aria-label="Významné události"></section>
    <section id="featured-layer" class="obs-layer" aria-label="Vybraný komentář"></section>
    <section id="chat-layer" class="obs-layer" aria-label="Průběžný chat"></section>
    <section id="ticker-layer" class="obs-layer" aria-label="Informační zpráva"></section>
  </main>
  <script src="/overlay.js"></script>
</body>
</html>
