name: Windows package
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/MetrobusStreamPanel -Force | Out-Null
          Copy-Item server.cjs,package.json,Spustit-Stream-Panel.bat,README.md dist/MetrobusStreamPanel/
          Copy-Item public dist/MetrobusStreamPanel/public -Recurse
          Copy-Item node_modules dist/MetrobusStreamPanel/node_modules -Recurse
          New-Item -ItemType Directory -Path dist/MetrobusStreamPanel/data -Force | Out-Null
          Compress-Archive -Path dist/MetrobusStreamPanel -DestinationPath dist/MetrobusStreamPanel-win-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MetrobusStreamPanel-win-x64
          path: dist/MetrobusStreamPanel-win-x64.zip
